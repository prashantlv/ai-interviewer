# version field is obsolete in Docker Compose v2 - removed

services:
  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: ai-interviewer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB database - DISABLED (using Atlas cloud)
  # mongodb:
  #   image: mongo:7
  #   container_name: ai-interviewer-mongodb
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
  #     MONGO_INITDB_DATABASE: ${DATABASE_NAME:-ai_interviewer}
  #   volumes:
  #     - mongodb-data:/data/db
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # Web Server (FastAPI)
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ai-interviewer-web
    ports:
      - "8009:8009"
    env_file:
      - ./.env
      - ./server/.env
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb+srv://root:XejrWinDai6SUHJc@cluster0.1rbkzbp.mongodb.net/hire2inspire_dev_db?retryWrites=true&w=majority}
      - DATABASE_NAME=${DATABASE_NAME:-hire2inspire_dev_db}
      - REDIS_URL=redis://redis:6379/0
      - DAILY_DOMAIN=${DAILY_DOMAIN:-human2intelligence.daily.co}
      - VIDEO_SERVICE=${VIDEO_SERVICE:-tavus}
      - BOT_IMPLEMENTATION=${BOT_IMPLEMENTATION:-openai}
      - TTS_SERVICE=${TTS_SERVICE:-cartesia}
    volumes:
      - ./web_server:/app
      - ./server:/app/server
    depends_on:
      redis:
        condition: service_healthy
      # mongodb removed - using Atlas
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RQ Worker for bot jobs
  rq-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # container_name removed - using replicas so Docker auto-generates unique names
    env_file:
      - ./.env
      - ./server/.env
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb+srv://root:XejrWinDai6SUHJc@cluster0.1rbkzbp.mongodb.net/hire2inspire_dev_db?retryWrites=true&w=majority}
      - DATABASE_NAME=${DATABASE_NAME:-hire2inspire_dev_db}
      - REDIS_URL=redis://redis:6379/0
      - WEB_SERVER_URL=http://web-server:8009
      - DAILY_DOMAIN=${DAILY_DOMAIN:-human2intelligence.daily.co}
      - VIDEO_SERVICE=${VIDEO_SERVICE:-tavus}
      - BOT_IMPLEMENTATION=${BOT_IMPLEMENTATION:-openai}
      - TTS_SERVICE=${TTS_SERVICE:-cartesia}
    volumes:
      - ./web_server:/app/web_server
      - ./server:/app/server
    depends_on:
      redis:
        condition: service_healthy
      # mongodb removed - using Atlas
      web-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1  # Run 1 worker to prevent duplicate bots

volumes:
  redis-data:
  # mongodb-data:  # Not needed - using Atlas
